name: Seed Database
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: cd backend && npm install
      - name: Fix clinic ID
        run: |
          cd backend && node -e "
          const mongoose = require('mongoose');
          mongoose.connect(process.env.MONGODB_URI).then(async () => {
            const Patient = require('./src/models/Patient');
            const Clinic = require('./src/models/Clinic');
            const clinic = await Clinic.findOne({});
            console.log('Clinic ID:', clinic._id.toString());
            const result = await Patient.updateMany({}, { clinicId: clinic._id });
            console.log('Patients updated:', result.modifiedCount);
            mongoose.disconnect();
          });
          "
        env:
          MONGODB_URI: mongodb+srv://admin:Admin12345@cluster0.mmnrxrk.mongodb.net/dental_agent?retryWrites=true&w=majority