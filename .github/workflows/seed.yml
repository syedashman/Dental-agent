name: Seed Database
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: cd backend && npm install
      - name: Check appointments
        run: |
          cd backend && node -e "
          const mongoose = require('mongoose');
          mongoose.connect(process.env.MONGODB_URI).then(async () => {
            const Appointment = require('./src/models/Appointment');
            const Patient = require('./src/models/Patient');
            const Clinic = require('./src/models/Clinic');
            
            const clinics = await Clinic.find({});
            console.log('Clinic IDs:', clinics.map(c => c._id.toString()));
            
            const patients = await Patient.find({});
            console.log('Patients:', patients.length);
            console.log('Patient clinicIds:', patients.map(p => p.clinicId?.toString()));
            
            const appointments = await Appointment.find({});
            console.log('Total Appointments:', appointments.length);
            
            mongoose.disconnect();
          });
          "
        env:
          MONGODB_URI: mongodb+srv://admin:Admin12345@cluster0.mmnrxrk.mongodb.net/dental_agent?retryWrites=true&w=majority