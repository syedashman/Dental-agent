name: Seed Database
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: cd backend && npm install
      - run: cd backend && node src/utils/seed.js
        env:
          MONGODB_URI: mongodb+srv://admin:Admin12345@cluster0.mmnrxrk.mongodb.net/dental_agent?retryWrites=true&w=majority